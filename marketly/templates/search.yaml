apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecom-search
  template:
    metadata:
      labels:
        app: ecom-search
    spec:
      nodeSelector:
        marketly.io/role: backend      # the two private nodes
      containers:
        - name: ecom-search
          image: {{ .Values.registry }}/ecom-search:{{ .Values.tags.search }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          env:
            - name: CATALOG_SERVICE_URL
              value: http://ecom-catalog:3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-search
spec:
  selector:
    app: ecom-search
  ports:
    - port: 3003
