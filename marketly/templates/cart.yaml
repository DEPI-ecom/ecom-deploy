apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecom-cart
  template:
    metadata:
      labels:
        app: ecom-cart
    spec:
      nodeSelector:
        marketly.io/role: backend      # the two private nodes
      containers:
        - name: ecom-cart
          image: {{ .Values.registry }}/ecom-cart:{{ .Values.tags.cart }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: marketly-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: postgresql://marketly:$(POSTGRES_PASSWORD)@postgres:5432/cart_db
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: marketly-secrets, key: JWT_SECRET } }
            - name: CATALOG_SERVICE_URL
              value: http://ecom-catalog:3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-cart
spec:
  selector:
    app: ecom-cart
  ports:
    - port: 3004
