apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecom-user
  template:
    metadata:
      labels:
        app: ecom-user
    spec:
      nodeSelector:
        marketly.io/role: backend      # the two private nodes
      containers:
        - name: ecom-user
          image: {{ .Values.registry }}/ecom-user:{{ .Values.tags.user }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: marketly-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: postgresql://marketly:$(POSTGRES_PASSWORD)@postgres:5432/users_db
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: marketly-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-user
spec:
  selector:
    app: ecom-user
  ports:
    - port: 3001
