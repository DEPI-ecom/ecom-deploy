apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecom-payment
  template:
    metadata:
      labels:
        app: ecom-payment
    spec:
      nodeSelector:
        marketly.io/role: backend      # the two private nodes
      containers:
        - name: ecom-payment
          image: {{ .Values.registry }}/ecom-payment:{{ .Values.tags.payment }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3006
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: marketly-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: postgresql://marketly:$(POSTGRES_PASSWORD)@postgres:5432/payments_db
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-payment
spec:
  selector:
    app: ecom-payment
  ports:
    - port: 3006
