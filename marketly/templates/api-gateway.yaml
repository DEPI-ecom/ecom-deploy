apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecom-api-gateway
  template:
    metadata:
      labels:
        app: ecom-api-gateway
    spec:
      nodeSelector:
        marketly.io/role: backend      # the two private nodes
      containers:
        - name: ecom-api-gateway
          image: {{ .Values.registry }}/ecom-api-gateway:{{ .Values.tags.apiGateway }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: FRONTEND_ORIGIN
              value: {{ .Values.frontendOrigin | quote }}
            - name: USER_SERVICE_URL
              value: http://ecom-user:3001
            - name: CATALOG_SERVICE_URL
              value: http://ecom-catalog:3002
            - name: SEARCH_SERVICE_URL
              value: http://ecom-search:3003
            - name: CART_SERVICE_URL
              value: http://ecom-cart:3004
            - name: ORDER_SERVICE_URL
              value: http://ecom-order:3005
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-api-gateway
spec:
  selector:
    app: ecom-api-gateway
  ports:
    - port: 8080
