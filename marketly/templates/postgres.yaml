# One postgres pod on the database node. Its data lives on the EBS disk
# that Ansible mounts at /mnt/postgres-data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
    CREATE DATABASE users_db;
    CREATE DATABASE catalog_db;
    CREATE DATABASE cart_db;
    CREATE DATABASE orders_db;
    CREATE DATABASE payments_db;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate      # never two postgres pods on the same data
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        marketly.io/role: database
      tolerations:
        - key: marketly.io/role
          value: database
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:17.12-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: marketly
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: marketly-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec:
              command: [pg_isready, -U, marketly]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          hostPath:
            path: /mnt/postgres-data
            type: Directory
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
