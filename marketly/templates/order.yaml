apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecom-order
  template:
    metadata:
      labels:
        app: ecom-order
    spec:
      nodeSelector:
        marketly.io/role: backend      # the two private nodes
      containers:
        - name: ecom-order
          image: {{ .Values.registry }}/ecom-order:{{ .Values.tags.order }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3005
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: marketly-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: postgresql://marketly:$(POSTGRES_PASSWORD)@postgres:5432/orders_db
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: marketly-secrets, key: JWT_SECRET } }
            - name: USER_SERVICE_URL
              value: http://ecom-user:3001
            - name: CATALOG_SERVICE_URL
              value: http://ecom-catalog:3002
            - name: CART_SERVICE_URL
              value: http://ecom-cart:3004
            - name: PAYMENT_SERVICE_URL
              value: http://ecom-payment:3006
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-order
spec:
  selector:
    app: ecom-order
  ports:
    - port: 3005
