# The address people type in the browser (public worker Elastic IP).
# Get it from the AWS console, or: terraform output public_worker_public_ip
frontendOrigin: http://CHANGE-ME

registry: ghcr.io/depi-ecom

# Image tag per service. Change a tag, commit, and Argo CD deploys it.
tags:
  web: latest
  apiGateway: latest
  user: latest
  catalog: latest
  search: latest
  cart: latest
  order: latest
  payment: latest
