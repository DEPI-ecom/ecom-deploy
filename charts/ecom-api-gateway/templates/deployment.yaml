apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-api-gateway
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: ecom-api-gateway
  template:
    metadata:
      labels:
        app: ecom-api-gateway
      annotations:
        # Restarts the pods when the ConfigMap changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        marketly.io/role: public       # next to ecom-web
      containers:
        - name: ecom-api-gateway
          image: {{ .Values.image }}:{{ .Values.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ecom-api-gateway-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
