# The only public part. It listens on port 80 of the public node.
# Its nginx forwards /api to ecom-api-gateway, so no ingress controller is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-web
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate      # only one pod can hold port 80
  selector:
    matchLabels:
      app: ecom-web
  template:
    metadata:
      labels:
        app: ecom-web
    spec:
      nodeSelector:
        marketly.io/role: public
      containers:
        - name: ecom-web
          image: {{ .Values.image }}:{{ .Values.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              hostPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 8080
