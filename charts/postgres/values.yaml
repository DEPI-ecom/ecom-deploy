image:
  repository: postgres
  tag: 17.12-alpine
  pullPolicy: IfNotPresent

database: postgres
auth:
  existingSecret: marketly-postgres-auth
  usernameKey: username
  passwordKey: password

service:
  port: 5432

persistence:
  enabled: true
  size: 10Gi
  storageClassName: marketly-postgres-local
  volumeName: marketly-postgres-data
  localPath: /mnt/postgres-data
  nodeHostname: db-worker
  reclaimPolicy: Retain

nodeSelector:
  marketly.io/role: database

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsUser: 70
  runAsGroup: 70
  fsGroup: 70
