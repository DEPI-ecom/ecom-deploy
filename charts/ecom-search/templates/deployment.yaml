apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-search
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: ecom-search
  template:
    metadata:
      labels:
        app: ecom-search
      annotations:
        # Restarts the pods when the ConfigMap changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        marketly.io/role: backend      # the two private nodes
      containers:
        - name: ecom-search
          image: {{ .Values.image }}:{{ .Values.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: ecom-search-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
