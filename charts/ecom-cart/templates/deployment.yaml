apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-cart
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: ecom-cart
  template:
    metadata:
      labels:
        app: ecom-cart
      annotations:
        # Restarts the pods when the ConfigMap changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        marketly.io/role: backend      # the two private nodes
      containers:
        - name: ecom-cart
          image: {{ .Values.image }}:{{ .Values.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: ecom-cart-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketly-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://marketly:$(POSTGRES_PASSWORD)@postgres:5432/cart_db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marketly-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
