apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-catalog
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: ecom-catalog
  template:
    metadata:
      labels:
        app: ecom-catalog
    spec:
      nodeSelector:
        marketly.io/role: backend      # the two private nodes
      containers:
        - name: ecom-catalog
          image: {{ .Values.image }}:{{ .Values.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketly-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://marketly:$(POSTGRES_PASSWORD)@postgres:5432/catalog_db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marketly-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
