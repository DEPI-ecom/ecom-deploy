apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-search
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DEPI-ecom/ecom-deploy.git
    targetRevision: main
    path: charts/ecom-search
  destination:
    server: https://kubernetes.default.svc
    namespace: marketly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
